<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manpreet Singh Dhalial — Portfolio</title>
<style>
  :root{
    --bg-editor:#1e1e1e;
    --bg-sidebar:#252526;
    --bg-activity:#333333;
    --bg-title:#323233;
    --bg-tab:#2d2d2d;
    --bg-tab-active:#1e1e1e;
    --bg-panel:#181818;
    --bg-statusbar:#007acc;
    --border:#3c3c3c;
    --text:#cccccc;
    --text-dim:#858585;
    --text-bright:#ffffff;
    --accent:#0078d4;
    --hover:#2a2d2e;
    --select:#04395e;
    /* syntax */
    --kw:#569cd6;       /* keyword */
    --str:#ce9178;      /* string */
    --fn:#dcdcaa;       /* function */
    --com:#6a9955;      /* comment */
    --num:#b5cea8;      /* number */
    --type:#4ec9b0;     /* type/class */
    --prop:#9cdcfe;     /* property */
    --punc:#d4d4d4;
    --md-h:#569cd6;
    --md-link:#4daafc;
    --ui-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,"Cascadia Code",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg-editor);color:var(--text);
    font-family:var(--ui-font);font-size:13px;
    display:flex;flex-direction:column;height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Title bar ---------- */
  .titlebar{
    height:35px;background:var(--bg-title);display:flex;align-items:center;
    padding:0 10px;flex-shrink:0;user-select:none;gap:14px;
    border-bottom:1px solid #000;
  }
  .traffic{display:flex;gap:8px}
  .traffic span{width:12px;height:12px;border-radius:50%}
  .t-red{background:#ff5f56}.t-yellow{background:#ffbd2e}.t-green{background:#27c93f}
  .menu{display:flex;gap:14px;color:#cccccc;font-size:12.5px}
  .menu span{cursor:default;opacity:.85}
  .menu span:hover{opacity:1}
  .title-center{flex:1;text-align:center;color:#9d9d9d;font-size:12px}
  @media(max-width:680px){.menu{display:none}.title-center{text-align:left}}

  /* ---------- Main body ---------- */
  .main{flex:1;display:flex;min-height:0}

  /* Activity bar */
  .activitybar{
    width:48px;background:var(--bg-activity);display:flex;flex-direction:column;
    align-items:center;padding-top:8px;flex-shrink:0;gap:4px;
  }
  .act-icon{
    width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    color:#858585;cursor:pointer;border-left:2px solid transparent;position:relative;
  }
  .act-icon svg{width:24px;height:24px;fill:currentColor}
  .act-icon:hover{color:#fff}
  .act-icon.active{color:#fff;border-left:2px solid #fff}
  .act-spacer{flex:1}
  @media(max-width:680px){.activitybar{width:44px}}

  /* Sidebar */
  .sidebar{
    width:260px;background:var(--bg-sidebar);flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--border);
  }
  .sb-header{
    padding:10px 16px 6px;font-size:11px;letter-spacing:.08em;color:#bbbbbb;
    text-transform:uppercase;display:flex;justify-content:space-between;
  }
  .sb-project{
    padding:2px 12px;font-size:11px;font-weight:700;letter-spacing:.05em;color:#cccccc;
    text-transform:uppercase;display:flex;align-items:center;gap:4px;cursor:pointer;
  }
  .sb-project .chev{transition:transform .15s}
  .tree{padding:2px 0 12px;overflow-y:auto}
  .row{
    display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;
    font-size:13px;color:#cccccc;height:22px;white-space:nowrap;
  }
  .row:hover{background:var(--hover)}
  .row.selected{background:var(--select)}
  .row .indent{flex-shrink:0}
  .row .ic{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .folder-children{overflow:hidden}
  .folder-children.collapsed{display:none}
  .fname{overflow:hidden;text-overflow:ellipsis}
  .chev{display:inline-block;width:10px;color:#888;font-size:10px;transition:transform .12s}
  .chev.collapsed{transform:rotate(-90deg)}
  @media(max-width:680px){
    .sidebar{position:absolute;z-index:40;height:calc(100% - 35px - 22px);box-shadow:4px 0 16px rgba(0,0,0,.5);transition:transform .2s;}
    .sidebar.hidden{transform:translateX(-110%)}
  }

  /* Editor column */
  .editor-col{flex:1;display:flex;flex-direction:column;min-width:0}
  .tabs{
    height:35px;background:#252526;display:flex;flex-shrink:0;overflow-x:auto;
    border-bottom:1px solid var(--border);scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;height:35px;
    background:var(--bg-tab);color:#969696;font-size:12.5px;cursor:pointer;
    border-right:1px solid var(--border);white-space:nowrap;position:relative;max-width:200px;
  }
  .tab.active{background:var(--bg-tab-active);color:#fff}
  .tab.active::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--accent)}
  .tab .close{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;
    justify-content:center;font-size:14px;opacity:.0}
  .tab:hover .close{opacity:.7}
  .tab.active .close{opacity:.6}
  .tab .close:hover{background:#ffffff22;opacity:1}
  .tab .dot{display:none;width:8px;height:8px;border-radius:50%;background:#cccccc}

  .breadcrumb{
    height:24px;background:var(--bg-editor);display:flex;align-items:center;gap:5px;
    padding:0 16px;color:#a9a9a9;font-size:12px;flex-shrink:0;border-bottom:1px solid #00000033;
  }
  .breadcrumb .sep{color:#666}

  .editor{flex:1;overflow:auto;position:relative;background:var(--bg-editor)}
  .code{display:flex;font-family:var(--mono);font-size:13.5px;line-height:1.55;min-height:100%}
  .gutter{
    flex-shrink:0;text-align:right;color:var(--text-dim);user-select:none;
    padding:12px 16px 40px 18px;white-space:pre;
  }
  .codebody{padding:12px 24px 40px 8px;white-space:pre;overflow-x:auto;color:var(--punc);flex:1}

  /* markdown preview */
  .mdprev{padding:28px 40px 60px;max-width:860px;line-height:1.6;font-family:var(--ui-font);font-size:14px;color:#d4d4d4}
  .mdprev h1{font-size:30px;font-weight:600;color:#fff;margin:8px 0 6px;border-bottom:1px solid #3c3c3c;padding-bottom:10px}
  .mdprev h2{font-size:21px;font-weight:600;color:#fff;margin:26px 0 8px;border-bottom:1px solid #3c3c3c;padding-bottom:6px}
  .mdprev h3{font-size:16px;font-weight:600;color:#dcdcdc;margin:18px 0 6px}
  .mdprev p{margin:10px 0}
  .mdprev a{color:var(--md-link);text-decoration:none}
  .mdprev a:hover{text-decoration:underline}
  .mdprev ul{margin:10px 0;padding-left:24px}
  .mdprev li{margin:4px 0}
  .mdprev code{background:#ffffff14;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px}
  .mdprev blockquote{border-left:3px solid #569cd6;padding:2px 14px;color:#a9b7c6;margin:12px 0;background:#ffffff08}
  .mdprev .badge{display:inline-block;background:#04395e;color:#9cdcfe;border-radius:4px;padding:3px 9px;margin:3px 4px 3px 0;font-size:12px;font-family:var(--mono)}
  .mdprev hr{border:none;border-top:1px solid #3c3c3c;margin:22px 0}
  .mdprev .avatar{width:84px;height:84px;border-radius:12px;background:linear-gradient(135deg,#0078d4,#27c93f);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#fff;font-family:var(--mono)}

  /* syntax token colors */
  .kw{color:var(--kw)} .str{color:var(--str)} .fn{color:var(--fn)}
  .com{color:var(--com);font-style:italic} .num{color:var(--num)}
  .type{color:var(--type)} .prop{color:var(--prop)} .pun{color:var(--punc)}
  .lnk{color:var(--md-link);text-decoration:underline;cursor:pointer}

  /* ---------- Panel (terminal) ---------- */
  .panel{height:230px;background:var(--bg-panel);flex-shrink:0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
  .panel.collapsed{height:32px}
  .panel-tabs{height:32px;display:flex;align-items:center;gap:18px;padding:0 16px;flex-shrink:0;font-size:11px;letter-spacing:.06em;border-bottom:1px solid #00000044}
  .panel-tabs .pt{color:#969696;text-transform:uppercase;cursor:pointer;height:32px;display:flex;align-items:center;border-bottom:1px solid transparent}
  .panel-tabs .pt.active{color:#fff;border-bottom:1px solid #e7e7e7}
  .panel-tabs .grow{flex:1}
  .panel-tabs .pbtn{color:#969696;cursor:pointer;font-size:15px;padding:0 4px}
  .panel-tabs .pbtn:hover{color:#fff}
  .term{flex:1;overflow-y:auto;padding:8px 16px 12px;font-family:var(--mono);font-size:13px;line-height:1.5;color:#cccccc}
  .term .line{white-space:pre-wrap;word-break:break-word}
  .term .prompt-user{color:#27c93f}
  .term .prompt-path{color:#569cd6}
  .term .prompt-sym{color:#cccccc}
  .term .err{color:#f48771}
  .term .ok{color:#9cdcfe}
  .term .muted{color:#858585}
  .input-line{display:flex;align-items:baseline;font-family:var(--mono);font-size:13px}
  .input-line input{
    background:transparent;border:none;outline:none;color:#fff;font-family:var(--mono);
    font-size:13px;flex:1;caret-color:#fff;
  }

  /* Status bar */
  .statusbar{
    height:22px;background:var(--bg-statusbar);color:#fff;display:flex;align-items:center;
    font-size:12px;flex-shrink:0;padding:0 6px;user-select:none;
  }
  .statusbar .sb-item{padding:0 8px;height:22px;display:flex;align-items:center;gap:5px;cursor:default}
  .statusbar .sb-item:hover{background:#ffffff22}
  .statusbar .grow{flex:1}
  .menu-toggle{display:none}
  @media(max-width:680px){
    .menu-toggle{display:flex;cursor:pointer}
    .statusbar .hide-sm{display:none}
  }

  /* Command palette */
  .palette-wrap{position:fixed;inset:0;background:#00000055;display:none;z-index:100;justify-content:center;align-items:flex-start}
  .palette-wrap.open{display:flex}
  .palette{margin-top:8px;width:600px;max-width:92vw;background:#252526;border:1px solid #454545;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.6);overflow:hidden}
  .palette input{width:100%;background:#3c3c3c;border:1px solid #007fd4;color:#fff;padding:8px 10px;font-size:13px;outline:none;font-family:var(--ui-font)}
  .palette .results{max-height:300px;overflow-y:auto}
  .palette .pres{padding:6px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#ccc}
  .palette .pres.active,.palette .pres:hover{background:var(--select)}
  .palette .pres .path{color:#858585;font-size:11px;margin-left:auto}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#424242;border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#4f4f4f}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>

/* Folder structure for the tree */
const TREE = [
  {type:"folder", name:"about", children:["about/README.md","about/profile.json"]},
  {type:"folder", name:"work", children:["work/projects.json"]},
  {type:"folder", name:"skills", children:["skills/stack.yml"]},
  {type:"folder", name:"connect", children:["connect/socials.ts"]},
  {type:"file", name:"LICENSE.txt", path:"LICENSE.txt"},
  {type:"file", name:".gitignore", path:".gitignore"},
];

/* ---- File-type icons (simple colored glyphs) ---- */
function iconFor(kind){
  const map = {
    md:["#519aba","M"], json:["#cbcb41","{}"], ts:["#519aba","TS"],
    yml:["#cb4b16","Y"], txt:["#cccccc","≡"], git:["#f14e32","◆"], js:["#cbcb41","JS"]
  };
  const [color,glyph]=map[kind]||["#cccccc","•"];
  return `<span class="ic" style="color:${color};font-size:10px;font-weight:700;font-family:var(--mono)">${glyph}</span>`;
}

/* ============================================================
   State + rendering
   ============================================================ */
let openTabs = [];      // array of file paths
let activeTab = null;
const collapsed = {};   // folder collapse state

const treeEl = document.getElementById('tree');
const tabsEl = document.getElementById('tabs');
const editorEl = document.getElementById('editor');
const breadcrumbEl = document.getElementById('breadcrumb');
const langStatusEl = document.getElementById('langStatus');

function renderTree(){
  treeEl.innerHTML = '';
  TREE.forEach(node=>{
    if(node.type==='folder'){
      const isCol = collapsed[node.name];
      const folder = document.createElement('div');
      const head = document.createElement('div');
      head.className='row';
      head.innerHTML = `<span class="indent" style="width:8px"></span>
        <span class="chev ${isCol?'collapsed':''}">⌄</span>
        <span class="ic" style="color:#dcb67a">📁</span>
        <span class="fname">${node.name}</span>`;
      head.onclick=()=>{collapsed[node.name]=!collapsed[node.name];renderTree();};
      folder.appendChild(head);
      const kids = document.createElement('div');
      kids.className='folder-children'+(isCol?' collapsed':'');
      node.children.forEach(path=>{
        kids.appendChild(fileRow(path, 28));
      });
      folder.appendChild(kids);
      treeEl.appendChild(folder);
    } else {
      treeEl.appendChild(fileRow(node.path, 14));
    }
  });
}

function fileRow(path, indent){
  const f = FILES[path];
  const row = document.createElement('div');
  row.className='row'+(activeTab===path?' selected':'');
  row.innerHTML = `<span class="indent" style="width:${indent}px"></span>${iconFor(f.icon)}<span class="fname">${f.name}</span>`;
  row.onclick=()=>{openFile(path); if(window.innerWidth<=680) hideSidebar();};
  return row;
}

function openFile(path){
  if(!openTabs.includes(path)) openTabs.push(path);
  activeTab = path;
  renderTabs(); renderEditor(); renderTree();
}

function closeTab(path, ev){
  ev && ev.stopPropagation();
  const i = openTabs.indexOf(path);
  openTabs = openTabs.filter(p=>p!==path);
  if(activeTab===path){
    activeTab = openTabs[Math.max(0,i-1)] || openTabs[0] || null;
  }
  renderTabs(); renderEditor(); renderTree();
}

function renderTabs(){
  tabsEl.innerHTML='';
  openTabs.forEach(path=>{
    const f=FILES[path];
    const tab=document.createElement('div');
    tab.className='tab'+(activeTab===path?' active':'');
    tab.innerHTML=`${iconFor(f.icon)}<span>${f.name}</span><span class="close">✕</span>`;
    tab.onclick=()=>{activeTab=path;renderTabs();renderEditor();renderTree();};
    tab.querySelector('.close').onclick=(e)=>closeTab(path,e);
    tabsEl.appendChild(tab);
  });
}

function renderEditor(){
  if(!activeTab){
    editorEl.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#5a5a5a;flex-direction:column;gap:14px;text-align:center;padding:20px">
      <div style="font-size:48px;opacity:.25">{ }</div>
      <div>Select a file from the explorer — or press <b>Ctrl/Cmd + P</b></div>
    </div>`;
    breadcrumbEl.innerHTML='';
    langStatusEl.textContent='';
    return;
  }
  const f=FILES[activeTab];
  langStatusEl.textContent=f.lang;
  // breadcrumb
  const parts=activeTab.split('/');
  breadcrumbEl.innerHTML = parts.map((p,i)=>
    `<span>${p}</span>`+(i<parts.length-1?'<span class="sep">›</span>':'')
  ).join('');

  if(f.type==='md'){
    editorEl.innerHTML=`<div class="mdprev">${f.body}</div>`;
  } else {
    const lines=f.body.split('\n');
    const gutter=lines.map((_,i)=>i+1).join('\n');
    editorEl.innerHTML=`<div class="code"><div class="gutter">${gutter}</div><div class="codebody">${f.body}</div></div>`;
  }
  editorEl.scrollTop=0;
  bindEditorLinks();
}

function bindEditorLinks(){
  editorEl.querySelectorAll('.lnk').forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      if(el.dataset.open){ openFile(el.dataset.open); }
      else if(el.dataset.href){ window.open(el.dataset.href,'_blank'); }
    };
  });
}

/* ============================================================
   Interactive terminal
   ============================================================ */
const termEl=document.getElementById('term');
const PROMPT = `<span class="prompt-user">msdhaliwal@portfolio</span><span class="prompt-sym">:</span><span class="prompt-path">~</span><span class="prompt-sym">$</span> `;

function termPrint(html, cls){
  const div=document.createElement('div');
  div.className='line'+(cls?' '+cls:'');
  div.innerHTML=html;
  // insert before the active input line
  termEl.insertBefore(div, inputLine);
  termEl.scrollTop=termEl.scrollHeight;
}

const COMMANDS={
  help(){
    termPrint(`Available commands:
  <span class="ok">whoami</span>     who is this person
  <span class="ok">ls</span>         list files in this workspace
  <span class="ok">cat</span> &lt;file&gt; print a file's contents
  <span class="ok">open</span> &lt;file&gt; open a file in the editor
  <span class="ok">skills</span>     show the tech stack
  <span class="ok">projects</span>   list current projects
  <span class="ok">socials</span>    how to reach me
  <span class="ok">echo</span> &lt;txt&gt;  print some text
  <span class="ok">date</span>       current date/time
  <span class="ok">clear</span>      clear the terminal
  <span class="ok">sudo</span>       nice try`);
  },
  whoami(){ termPrint(`Manpreet Singh Dhaliwal — Senior Software Engineer & dev-tools tinkerer, based in Punjab.`); },
  ls(){
    const all=Object.keys(FILES);
    termPrint(all.map(p=>`<span class="ok">${p}</span>`).join('   '));
  },
  cat(args){
    const path=resolvePath(args[0]);
    if(!path){ termPrint(`cat: ${args[0]||''}: No such file`,'err'); return; }
    const f=FILES[path];
    // strip tags for terminal display
    const tmp=document.createElement('div'); tmp.innerHTML=f.body;
    termPrint(tmp.textContent.trim().replace(/</g,'&lt;'));
  },
  open(args){
    const path=resolvePath(args[0]);
    if(!path){ termPrint(`open: ${args[0]||''}: No such file`,'err'); return; }
    openFile(path);
    termPrint(`Opened <span class="ok">${path}</span> in the editor ↑`);
  },
  skills(){ termPrint(`TypeScript · Rust · Go · Python · React · Svelte · Postgres · Docker · k8s`); },
  projects(){
    termPrint(`flint        tiny static-site CLI (Rust)    ★ 3.1k
querykit     type-safe SQL builder (TS)     ★ 1.8k
dotfiles     terminal + editor setup        ★ 410`);
  },
  socials(){
    termPrint(`email     contact@msdhaliwal.com
github    github.com/msdhaliwal
x         x.com/msdhaliwal
website   msdhaliwal.dev`);
  },
  echo(args){ termPrint(args.join(' ').replace(/</g,'&lt;') || ''); },
  date(){ termPrint(new Date().toString()); },
  clear(){ [...termEl.querySelectorAll('.line')].forEach(l=>l.remove()); },
  sudo(){ termPrint(`Nice try. You're not in the sudoers file. This incident will be reported. 🚓`,'err'); },
};

function resolvePath(arg){
  if(!arg) return null;
  if(FILES[arg]) return arg;
  // match by filename
  const hit=Object.keys(FILES).find(p=>p.split('/').pop()===arg || p===arg);
  return hit||null;
}

function runCommand(raw){
  const line=raw.trim();
  // echo the command with prompt
  const echoed=document.createElement('div');
  echoed.className='line';
  echoed.innerHTML=PROMPT+escapeHtml(line);
  termEl.insertBefore(echoed, inputLine);
  if(!line) return;
  const [cmd,...args]=line.split(/\s+/);
  if(COMMANDS[cmd]) COMMANDS[cmd](args);
  else termPrint(`command not found: ${escapeHtml(cmd)} — try <span class="ok">help</span>`,'err');
  termEl.scrollTop=termEl.scrollHeight;
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* build the persistent input line */
const inputLine=document.createElement('div');
inputLine.className='input-line';
inputLine.innerHTML=PROMPT+`<input id="termInput" autocomplete="off" spellcheck="false">`;
termEl.appendChild(inputLine);
const termInput=inputLine.querySelector('#termInput');

const history=[]; let histIdx=-1;
termInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=termInput.value; if(v.trim()){history.push(v);histIdx=history.length;}
    termInput.value=''; runCommand(v);
  } else if(e.key==='ArrowUp'){
    if(histIdx>0){histIdx--;termInput.value=history[histIdx];e.preventDefault();}
  } else if(e.key==='ArrowDown'){
    if(histIdx<history.length-1){histIdx++;termInput.value=history[histIdx];}
    else{histIdx=history.length;termInput.value='';}
  }
});
termEl.addEventListener('click',()=>termInput.focus());

/* boot message */
termPrint(`<span class="muted">Welcome to msdhaliwal — interactive portfolio terminal.</span>`);
termPrint(`<span class="muted">Type</span> <span class="ok">help</span> <span class="muted">to get started.</span>`);

/* ============================================================
   Command palette (Ctrl/Cmd + P)
   ============================================================ */
const paletteWrap=document.getElementById('paletteWrap');
const paletteInput=document.getElementById('paletteInput');
const paletteResults=document.getElementById('paletteResults');
let palSel=0, palList=[];

function openPalette(){
  paletteWrap.classList.add('open');
  paletteInput.value=''; renderPalette(''); paletteInput.focus();
}
function closePalette(){ paletteWrap.classList.remove('open'); }
function renderPalette(q){
  const all=Object.keys(FILES);
  palList=all.filter(p=>p.toLowerCase().includes(q.toLowerCase()));
  palSel=0;
  paletteResults.innerHTML=palList.map((p,i)=>{
    const f=FILES[p];
    return `<div class="pres ${i===0?'active':''}" data-path="${p}">${iconFor(f.icon)}<span>${f.name}</span><span class="path">${p}</span></div>`;
  }).join('') || `<div class="pres muted" style="color:#858585">No matching files</div>`;
  paletteResults.querySelectorAll('.pres[data-path]').forEach(el=>{
    el.onclick=()=>{openFile(el.dataset.path);closePalette();};
  });
}
paletteInput.addEventListener('input',e=>renderPalette(e.target.value));
paletteInput.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePalette();
  else if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palList.length-1);updatePalSel();e.preventDefault();}
  else if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);updatePalSel();e.preventDefault();}
  else if(e.key==='Enter'){ if(palList[palSel]){openFile(palList[palSel]);closePalette();} }
});
function updatePalSel(){
  const items=[...paletteResults.querySelectorAll('.pres[data-path]')];
  items.forEach((el,i)=>el.classList.toggle('active',i===palSel));
  items[palSel] && items[palSel].scrollIntoView({block:'nearest'});
}
paletteWrap.addEventListener('click',e=>{ if(e.target===paletteWrap)closePalette(); });

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='p'){ e.preventDefault(); openPalette(); }
});
document.getElementById('actSearch').onclick=openPalette;
